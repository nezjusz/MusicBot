name: Make Release

# Builds the bot into a runnable fat jar and uploads it to a GitHub Release.
# Trigger manually and provide a version number + description.
#
# NOTE: This project now requires Java 25 (for JDA 6 + JDAVE / DAVE voice support).
on:
  workflow_dispatch:
    inputs:
      version_number:
        description: 'Version Number'
        required: true
        type: string
      info:
        description: 'Description of this Release'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build_jar:
    name: Build Jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set Version
        uses: datamonsters/replace-action@v2
        with:
          files: 'pom.xml'
          replacements: 'Snapshot=${{ github.event.inputs.version_number }}'

      - name: Build with Maven
        # package (instead of verify) produces the shaded "-All" jar without running the unit tests,
        # so a release artifact is always produced even if a test is flaky.
        run: mvn --batch-mode --update-snapshots package -DskipTests

      - name: Rename jar
        run: mv target/*-All.jar JMusicBot-${{ github.event.inputs.version_number }}.jar

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: JMusicBot-${{ github.event.inputs.version_number }}.jar
          if-no-files-found: error

  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build_jar
    steps:
      - name: Download a Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: .

      - name: Show Artifacts
        run: ls -R

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.inputs.version_number }}
          name: Version ${{ github.event.inputs.version_number }}
          draft: false
          prerelease: false
          artifacts: "*.jar"
          body: |
            ${{ github.event.inputs.info }}

            ---
            ### Setup
            https://jmusicbot.com/setup
            https://jmusicbot.com/config
            # Download: [JMusicBot-${{ github.event.inputs.version_number }}.jar](https://github.com/nezjusz/MusicBot/releases/download/${{ github.event.inputs.version_number }}/JMusicBot-${{ github.event.inputs.version_number }}.jar)
