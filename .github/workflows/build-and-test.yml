name: Build and Test

# Compiles (and tests) the bot on every push/PR to master.
# Requires Java 25 (JDA 6 + JDAVE / DAVE voice support).
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        run: mvn --batch-mode --update-snapshots verify
